[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "digit-recognition-cnn-from-scratch"
version = "1.0.0"
description = "Convolutional neural network written from scratch in NumPy, trained on MNIST and compared with TensorFlow/Keras."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "bartek03m" }]
requires-python = ">=3.10"
# The my_cnn library itself needs only NumPy.
# NumPy 2 is required to load models/custom_cnn.pkl.
dependencies = [
    "numpy>=2.1,<3",
]

[project.optional-dependencies]
# Desktop app (the custom NumPy model works without TensorFlow)
gui = [
    "pillow>=11.0",
    "scipy>=1.14.1",
]
# Keras models (the .keras files were saved with Keras 3.14)
keras = [
    "tensorflow>=2.20,<3",
    "keras>=3.14,<4",
]
# Training and evaluation notebooks
notebooks = [
    "digit-recognition-cnn-from-scratch[keras]",
    "scipy>=1.14.1",
    "pandas>=2.2.3",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scikit-learn>=1.5.2",
    "ipykernel>=6.29",
]
all = [
    "digit-recognition-cnn-from-scratch[gui,keras,notebooks]",
]

[project.urls]
Repository = "https://github.com/bartek03m/digit-recognition-CNN-from-scratch"

[tool.setuptools]
packages = ["my_cnn"]
